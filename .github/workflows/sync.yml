name: sync-sheet

on:
  workflow_dispatch:        # manual "Run workflow" button on the Actions tab. Cron added later.

permissions:
  contents: write           # lets the runner commit the JSON/xlsx back to the repo

concurrency:
  group: sync-sheet         # never run two syncs at once
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch sheet and build JSON + xlsx
        run: python py/sync_sheet.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -C "$GITHUB_REF_NAME"
          git add data/hep-tracking.json data/hep-tracking.xlsx
          if git diff --cached --quiet; then
            echo "No changes. Nothing to commit."
          else
            git commit -m "data: refresh from Google Sheet"
            git push
          fi
